name: Android App

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  push:
    tags:
      - '*'
      - '!*-alpha*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Core tests and live API contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build and start a throwaway server
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
          go build -o "$RUNNER_TEMP/new-api" .
          cd "$RUNNER_TEMP"
          SQLITE_PATH="$RUNNER_TEMP/contract.db" SESSION_SECRET=android-contract-test \
            nohup ./new-api --port 3000 --log-dir "$RUNNER_TEMP/logs" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/status > /dev/null && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:3000/api/setup \
            -H 'Content-Type: application/json' \
            -d '{"username":"root","password":"ContractPass123!","confirmPassword":"ContractPass123!","SelfUseModeEnabled":false,"DemoSiteEnabled":false}' \
            | tee /dev/stderr | grep -q '"success":true'

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Core unit and contract tests
        working-directory: android
        env:
          NEWAPI_IT_BASE_URL: http://127.0.0.1:3000
          NEWAPI_IT_USERNAME: root
          NEWAPI_IT_PASSWORD: ContractPass123!
        run: ./gradlew --no-daemon :core:test

      - name: Server log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/server.log"

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.1.0-${GITHUB_SHA::7}"
          fi
          echo "ANDROID_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/new-api-admin-${ANDROID_VERSION_NAME}.apk"
          sha256sum dist/*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: new-api-admin-apk
          path: dist/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
