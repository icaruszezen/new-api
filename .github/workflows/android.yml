name: Android App

# Pull requests that change the app build it and publish a beta release; merging into main publishes a
# stable release. The app looks for updates in these releases (see android/README.md). Documentation
# changes publish nothing, and neither does a workflow-only change merged into main, since every release
# makes the app offer an update.
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - '!android/**/*.md'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '!android/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # A newer push to a pull request replaces its build; builds of main run one after another.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Core tests and live API contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build and start a throwaway server
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
          go build -o "$RUNNER_TEMP/new-api" .
          cd "$RUNNER_TEMP"
          SQLITE_PATH="$RUNNER_TEMP/contract.db" SESSION_SECRET=android-contract-test \
            nohup ./new-api --port 3000 --log-dir "$RUNNER_TEMP/logs" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/status > /dev/null && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:3000/api/setup \
            -H 'Content-Type: application/json' \
            -d '{"username":"root","password":"ContractPass123!","confirmPassword":"ContractPass123!","SelfUseModeEnabled":false,"DemoSiteEnabled":false}' \
            | tee /dev/stderr | grep -q '"success":true'

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Core unit and contract tests
        working-directory: android
        env:
          NEWAPI_IT_BASE_URL: http://127.0.0.1:3000
          NEWAPI_IT_USERNAME: root
          NEWAPI_IT_PASSWORD: ContractPass123!
        run: ./gradlew --no-daemon :core:test

      - name: Server log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/server.log"

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      channel: ${{ steps.version.outputs.channel }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Determine version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base=$(tr -d '[:space:]' < android/VERSION)
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=android/VERSION::android/VERSION must be MAJOR.MINOR, got '$base'"
            exit 1
          fi
          # The run number is both the versionCode and the last part of the version name. It grows with
          # every build, beta or stable, so a newer build always installs over an older one.
          case "$GITHUB_EVENT_NAME" in
            pull_request) name="$base.$RUN_NUMBER-beta"; channel=beta ;;
            push) name="$base.$RUN_NUMBER"; channel=stable ;;
            *) name="$base.$RUN_NUMBER-dev"; channel=none ;;
          esac
          echo "ANDROID_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$RUN_NUMBER" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Android signing secrets are not set. The APK is signed with a throwaway debug key, cannot upgrade an earlier install, has in-app updates turned off, and is not published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/new-api-admin-${ANDROID_VERSION_NAME}.apk"
          sha256sum dist/*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: new-api-admin-apk
          path: dist/*.apk

  publish:
    name: Publish release
    needs: [contract, apk]
    # Signed builds of this repository only; pull requests from forks get neither the key nor a write token.
    if: >-
      needs.apk.outputs.signed == 'true' && needs.apk.outputs.channel != 'none' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: new-api-admin-apk
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ needs.apk.outputs.version-name }}
          CHANNEL: ${{ needs.apk.outputs.channel }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # The app finds its releases by this tag pattern (android/core/.../update/AppUpdater.kt).
          tag="android-v$VERSION_NAME"
          apk="dist/new-api-admin-$VERSION_NAME.apk"
          # The notes are what the app's update dialog shows: the pull request title for a beta, the
          # commit subject for a stable build. A merge commit's subject only names the branch, so its
          # notes are the pull request title from the first line of the body.
          if [ "$CHANNEL" = beta ]; then
            target="$PR_HEAD_SHA"
            prerelease=true
            printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" > notes.md
          else
            target="$GITHUB_SHA"
            prerelease=false
            subject="${COMMIT_MESSAGE%%$'\n'*}"
            if [[ $subject =~ ^Merge\ pull\ request\ (#[0-9]+)\  && $COMMIT_MESSAGE == *$'\n\n'* ]]; then
              body="${COMMIT_MESSAGE#*$'\n\n'}"
              subject="${body%%$'\n'*} (${BASH_REMATCH[1]})"
            fi
            printf '%s\n' "$subject" > notes.md
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            # A re-run of the same build replaces its APK.
            gh release upload "$tag" "$apk" --clobber
          else
            # --latest=false keeps the server's release as the repository's "Latest". Tags created with
            # GITHUB_TOKEN start no workflows, so the server's tag-triggered release builds stay quiet.
            gh release create "$tag" "$apk" --target "$target" --title "Android Admin App $VERSION_NAME" --notes-file notes.md \
              --prerelease="$prerelease" --latest=false
          fi
